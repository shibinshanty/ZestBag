services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ecommerce-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:7
    container_name: ecommerce-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  rabbitmq_data:
  redis_data: